name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, so a new Dart or Flutter stable that breaks the plugin shows up
  # here before an app repo upgrades into it.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Dart stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The example needs the Flutter SDK; the example job resolves it.
      - run: dart pub get --no-example
      # The example is a separate Flutter package, not resolved in this job.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - run: dart test

  example:
    name: Example check (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest stable, unpinned (an empty version), and the floor app
        # repos run.
        include:
          - label: stable
            version: ""
          - label: 3.47.9
            version: 3.47.9
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
      - run: tool/check_example.sh

  # GitHub switches off a public repo's scheduled workflows after 60 days with
  # no repository activity. Re-enabling this workflow on each scheduled run
  # resets that timer, so the weekly check keeps running in a quiet repo.
  keepalive:
    name: Keep the weekly schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ci.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
