name: flutter_house_lints
description: Analyzer plugin that flags raw Material components in Flutter app code, so pages use the app's shared design-system widgets.
version: 0.1.0
publish_to: none
repository: https://github.com/zeeshanahmad0201/flutter-house-lints

environment:
  sdk: ^3.13.0

dependencies:
  analysis_server_plugin: ^0.3.25
  analyzer: ^14.6.0

dev_dependencies:
  analyzer_testing: ^0.4.4
  lints: ^6.0.0
  test: ^1.25.0
  test_reflective_loader: ^0.2.0
